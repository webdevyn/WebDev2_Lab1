<form id="inputform" class="gap-4">
  <div class="grid grid-cols-2 gap-4 mb-4 px-4">
    <label id="labelInput" for="inputValue" class="block font-medium mb-1"
      >Kg</label
    >
    <input
      id="inputValue"
      type="number"
      placeholder="Enter value"
      class="w-full p-2 border border-gray-300 rounded-lg"
    />

    <label id="labelOutput" for="outputValue" class="block font-medium mb-1"
      >Pounds</label
    >
    <input
      id="outputValue"
      type="number"
      placeholder="Enter value"
      class="w-full p-2 border border-gray-300 rounded-lg"
    />
  </div>
</form>

<script src="script.js"></script>
